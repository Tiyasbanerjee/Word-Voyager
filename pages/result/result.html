<section class="result-page floating-enter">
    <article class="result-card card-3d layer-strong">
        <p class="eyebrow">Session Report</p>
        <h2>Voyage Complete</h2>

        <div class="result-stats">
            <div class="result-tile">
                <span>Final Score</span>
                <strong id="final-score">0</strong>
            </div>
            <div class="result-tile">
                <span>Accuracy</span>
                <strong id="final-accuracy">0%</strong>
            </div>
            <div class="result-tile">
                <span>Correct</span>
                <strong id="final-correct">0</strong>
            </div>
        </div>

        <div class="chart-wrap card-3d layer-soft">
            <canvas id="progress-chart"></canvas>
        </div>

        <div class="result-actions">
            <button id="restart-btn" class="btn btn-primary">New Voyage</button>
        </div>
    </article>
</section>
