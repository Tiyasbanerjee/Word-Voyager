<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Voyager</title>
    <meta name="description" content="Adaptive vocabulary game with a modern, immersive 3D-inspired interface.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="index.js"></script>
</head>

<body>
    <div class="scene-bg" aria-hidden="true">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="grid-glow"></div>
    </div>

    <div class="shell">
        <header class="topbar card-3d">
            <div class="brand-pill">
                <span class="brand-dot"></span>
                <span>Word Voyager</span>
            </div>
            <p class="topbar-copy">Modern vocabulary training with adaptive challenge.</p>
        </header>

        <main id="app" aria-live="polite">
            <section class="loading card-3d">
                <h1>Loading Interface</h1>
                <p>Preparing your immersive language journey...</p>
            </section>
        </main>
    </div>

    <audio id="bg_music" loop>
        <source src="sound/2.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx_correct" src="sound/Right.mp3"></audio>
    <audio id="sfx_wrong" src="sound/Wrong.mp3"></audio>
</body>

</html>
